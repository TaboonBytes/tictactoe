         <!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic Tac Toe</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height:100vh;
                margin: 0;
                background: #1a1a2e;
                color: #eee;
            }
            .container {
                text-align: center;
            }
            h1 {
                margin-bottom: 20px;
            }
            .status {
                font-size: 1.5rem;
                margin-bottom: 20px;
                min-height: 2rem;
            }
            .board {
                display: grid;
                grid-template-columns: repeat(3, 100px);
                grid-template-rows: repeat(3, 100px);
                gap: 5px;
                margin: 0 auto 20px;
            }
            .cell {
                background: #16213e;
                border: 4px solid #0f3460;
                font-size: 3rem;
                font-weight: bold;
                cursor: pointer;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: background 0.2s;
            }
            .cell:hover {
                background: #1f4068;
            }
            .cell.x {
                color: #e94560;
            }
            .cell.o {
                color: #00deff;
            }
            .cell.winner {
                background: #0f3460;
                animation: pulse 0.5s ease-in-out infinite alternate;
            }
            @keyframes pulse {
                from { transform: scale(1); }
                to { transform: scale(1.05); }
            }
            button {
                padding: 12px 30px;
                font-size: 1rem;
                background: #e94560;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background 0.2s;
            }
            button:hover {
                background: #ff6b6b;
            }
            .cell {
    transition: transform 0.15s ease, background 0.2s;
}

.cell.pop {
    transform: scale(1.2);
}

.cell.x.pop {
    text-shadow: 0 0 10px #e94560;
}

.cell.o.pop {
    text-shadow: 0 0 10px #00deff;
}
        .board {
    position: relative;
}

.win-line {
    position: absolute;
    height: 6px;
    background: #00deff;
    width: 0;
    top: 50%;
    left: 0;
    transform-origin: left;
    transition: width 0.4s ease;
    border-radius: 10px;
    pointer-events: none;
}

#confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 1;
    animation: confetti-fall 1.5s ease-out forwards;
}

@keyframes confetti-fall {
    0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translate(var(--x), var(--y)) rotate(720deg);
        opacity: 0;
    }
}

        </style>
    </head>
    <body>
        <div class="container">
            <h1>TIC TAC TOE</h1>
            <div class="status" id="status">X's turn</div>
            <div>
    Difficulty:
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>
</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
				<div class="cell" data-index="2"></div>
				<div class="cell" data-index="3"></div>
				<div class="cell" data-index="4"></div>
				<div class="cell" data-index="5"></div>
				<div class="cell" data-index="6"></div>
				<div class="cell" data-index="7"></div>
				<div class="cell" data-index="8"></div>
                <div class="win-line" id="winLine"></div>
		</div>
            <div id="confetti-container"></div>
			<button id="reset">New Game</button>
        </div>

        <script>
			const cells = document.querySelectorAll('.cell');
			const status = document.getElementById('status');
			const resetBtn = document.getElementById('reset');
			
			let board = ['', '', '', '', '', '', '', '', ''];
			let currentPlayer = 'X';
			let gameActive = true;
            let gameMode = "computer"; // 'computer' or 'online'
            let humanPlayer = 'X';
            let computerPlayer = 'O';
			let difficulty = "medium";
const difficultySelect = document.getElementById("difficulty");
			const winPatterns = [
			    [0, 1, 2], [3, 4, 5], [6, 7, 8], 
				[0, 3, 6], [1, 4, 7], [2, 5, 8], 
				[0, 4, 8], [2, 4, 6]             
			];
            const winLines = {
    "0,1,2": { top: "16%", left: "0%", width: "100%", rotate: "0deg" },
    "3,4,5": { top: "50%", left: "0%", width: "100%", rotate: "0deg" },
    "6,7,8": { top: "83%", left: "0%", width: "100%", rotate: "0deg" },

    "0,3,6": { top: "0%", left: "16%", width: "6px", height: "100%", rotate: "0deg" },
    "1,4,7": { top: "0%", left: "50%", width: "6px", height: "100%", rotate: "0deg" },
    "2,5,8": { top: "0%", left: "83%", width: "6px", height: "100%", rotate: "0deg" },

    "0,4,8": { top: "0%", left: "0%", width: "140%", rotate: "45deg" },
    "2,4,6": { top: "0%", left: "0%", width: "140%", rotate: "-45deg" }
};
           function findWinningMove(player) {
        for (let i = 0; i < board.length; i++) {
        if (board[i] !== '') continue;

        board[i] = player;

        const wins = winPatterns.some(pattern =>
            pattern.every(index => board[index] === player)
        );

        board[i] = '';

        if (wins) {
            return i;
        }
    }
    return -1;
}
            function handleClick(e) {
                if (currentPlayer !== humanPlayer) return;
                const index = e.target.dataset.index;

                if (board[index] !== '' || !gameActive) return;

                board[index] = currentPlayer;
                e.target.textContent = currentPlayer;
                e.target.classList.add('pop');
                setTimeout(() => e.target.classList.remove('pop'), 150);
                e.target.classList.add(currentPlayer.toLowerCase());

                if (checkWinFor(humanPlayer)) {
                    status.textContent = `${humanPlayer} wins!` ;
                    gameActive = false;
                    highlightWinner();
                    launchConfetti();
                    return;
                }

                if (board.every(cell => cell !== '')) {
                    status.textContent = "It's a draw!";
                    gameActive = false;
                    return;
                }

                currentPlayer = computerPlayer;
                status.textContent = "Computer Thinking..." ;
                setTimeout(() => {
                    computerMove();
                }, 500); 
            }

function computerMove() {
    let move;

    if (difficulty === "easy") {
        move = getRandomMove();
    }

    else if (difficulty === "medium") {
        move = getStrategicMove();
    }

    else if (difficulty === "hard") {
        move = getBestMoveMinimax();
    }

    // Make move
    board[move] = computerPlayer;
    cells[move].textContent = computerPlayer;
    cells[move].classList.add('o');
    cells[move].classList.add('pop');
    setTimeout(() => cells[move].classList.remove('pop'), 150);
    if (checkWinFor(computerPlayer)) {
        status.textContent = "Computer wins!";
        gameActive = false;
        highlightWinner();
        launchConfetti();
        return;
    }

    if (board.every(cell => cell !== '')) {
        status.textContent = "It's a draw!";
        gameActive = false;
        return;
    }

    currentPlayer = humanPlayer;
    status.textContent = "Your Turn";
}
    function checkWin() {
    return winPatterns.some(pattern => { 
    return pattern.every(index => board[index] === currentPlayer);
        }); 
    }
    function launchConfetti() {
    const container = document.getElementById("confetti-container");

    for (let i = 0; i < 100; i++) {
        const piece = document.createElement("div");

        piece.classList.add("confetti");

        const colors = [
            "#ff0000",
            "#00ff00",
            "#0000ff",
            "#ffff00",
            "#ff00ff",
            "#00ffff"
        ];

        piece.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.left = "50%";
        piece.style.top = "50%";

        piece.style.setProperty(
            "--x",
            `${(Math.random() - 0.5) * 800}px`
        );

        piece.style.setProperty(
            "--y",
            `${Math.random() * 600}px`
        );

        container.appendChild(piece);

        setTimeout(() => piece.remove(), 1500);
    }
}
    function highlightWinner() {
    const winLine = document.getElementById("winLine");

    for (let pattern of winPatterns) {
        if (pattern.every(index => board[index] === currentPlayer)) {

            const key = pattern.join(",");
            const config = winLines[key];

            if (config) {
                winLine.style.top = config.top;
                winLine.style.left = config.left;
                winLine.style.width = config.width;

                if (config.height) {
                    winLine.style.height = config.height;
                }

                winLine.style.transform = `rotate(${config.rotate})`;
                winLine.style.width = config.width;
                winLine.style.opacity = "1";
            }

            pattern.forEach(index => {
                cells[index].classList.add('winner');
            });
        }
    }
}
function getRandomMove() {
    let empty = [];
    board.forEach((cell, i) => {
        if (cell === '') empty.push(i);
    });
    return empty[Math.floor(Math.random() * empty.length)];
}
function getStrategicMove() {
    let move = findWinningMove(computerPlayer);
    if (move !== -1) return move;

    move = findWinningMove(humanPlayer);
    if (move !== -1) return move;

    if (board[4] === '') return 4;

    const corners = [0,2,6,8].filter(i => board[i] === '');
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];

    const sides = [1,3,5,7].filter(i => board[i] === '');
    return sides[Math.floor(Math.random() * sides.length)];
}
function getBestMoveMinimax() {
    let bestScore = -Infinity;
    let move;

    for (let i = 0; i < board.length; i++) {
        if (board[i] === '') {
            board[i] = computerPlayer;
            let score = minimax(board, 0, false);
            board[i] = '';

            if (score > bestScore) {
                bestScore = score;
                move = i;
            }
        }
    }

    return move;
}
function minimax(newBoard, depth, isMaximizing) {
    if (checkWinFor(computerPlayer)) return 10 - depth;
    if (checkWinFor(humanPlayer)) return depth - 10;
    if (newBoard.every(cell => cell !== '')) return 0;

    if (isMaximizing) {
        let best = -Infinity;

        for (let i = 0; i < newBoard.length; i++) {
            if (newBoard[i] === '') {
                newBoard[i] = computerPlayer;
                best = Math.max(best, minimax(newBoard, depth + 1, false));
                newBoard[i] = '';
            }
        }

        return best;
    } else {
        let best = Infinity;

        for (let i = 0; i < newBoard.length; i++) {
            if (newBoard[i] === '') {
                newBoard[i] = humanPlayer;
                best = Math.min(best, minimax(newBoard, depth + 1, true));
                newBoard[i] = '';
            }
        }

        return best;
    }
}
    function resetGame() {
        document.getElementById("confetti-container").innerHTML = "";
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X'; 
        gameActive = true; 
        status.textContent = "X's turn"; 
        cells.forEach(cell => { 
        cell.textContent = ''; 
        cell.classList.remove('x', 'o', 'winner'); 
        }); 
        const winLine = document.getElementById("winLine");
winLine.style.width = "0";
winLine.style.opacity = "0";
    } 
    function checkWinFor(player) {
                    return winPatterns.some(pattern =>
                        pattern.every(index => board[index] === player)
                    );
                }
        cells.forEach(cell => {
        cell.addEventListener('click', handleClick);
        });
        resetBtn.addEventListener('click', resetGame);
        difficultySelect.addEventListener("change", (e) => {
    difficulty = e.target.value;
});
    </script>
    
	</body>
    </html>
